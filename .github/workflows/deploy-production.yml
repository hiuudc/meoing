name: Deploy production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA on main with a successful push CI run
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate release commit
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be an exact 40-character Git commit SHA" >&2
            exit 1
          fi

          resolved_sha="$(git rev-parse --verify "${RELEASE_SHA}^{commit}")"
          if [[ "${resolved_sha,,}" != "${RELEASE_SHA,,}" ]]; then
            echo "commit_sha did not resolve to the exact requested commit" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$resolved_sha" origin/main; then
            echo "The requested release commit is not reachable from origin/main" >&2
            exit 1
          fi

          successful_ci_runs="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${resolved_sha}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(
                .conclusion == "success"
                and .event == "push"
                and .head_branch == "main"
              )] | length'
          )"
          if [[ "$successful_ci_runs" -lt 1 ]]; then
            echo "No successful main push CI run exists for ${resolved_sha}" >&2
            exit 1
          fi

          git checkout --detach "$resolved_sha"
          echo "release_sha=$resolved_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Verify release
        run: npm run check
        working-directory: backend
      - name: Verify frontend
        run: npm run test
        working-directory: frontend
      - name: Build web and production extension
        run: npm run build
        working-directory: frontend
        env:
          VITE_MEOI_API_URL: ${{ vars.MEOI_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          MEOI_WEB_ORIGINS: ${{ vars.MEOI_WEB_ORIGINS }}
          MEOI_REQUIRE_WEB_ORIGINS: "true"
      - name: Start disposable Supabase database
        run: npm run db:start
        working-directory: backend
      - name: Apply migrations and seed locally
        run: npx supabase db reset
        working-directory: backend
      - name: Run production-release pgTAP/RLS tests
        run: npx supabase test db
        working-directory: backend
      - name: Stop disposable Supabase database
        if: always()
        run: npx supabase stop --no-backup
        working-directory: backend
      - name: Link production database
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Apply production migrations
        run: npx supabase db push --linked --include-all
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy maintenance Worker
        run: npx wrangler deploy --config wrangler.maintenance.jsonc --env production
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy API Worker
        run: npx wrangler deploy --config wrangler.api.jsonc --env production
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload production extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: meoi-bridge-v8-production-${{ steps.release.outputs.release_sha }}
          path: frontend/dist-extension
          if-no-files-found: error
          retention-days: 30
      - name: Deploy production Pages
        run: npx wrangler pages deploy ../frontend/dist-pages --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      - name: Production smoke test
        run: |
          curl --fail --retry 5 --retry-delay 5 "${MEOI_API_URL}/health/live"
          curl --fail --retry 5 --retry-delay 5 "${MEOI_API_URL}/health/ready"
        env:
          MEOI_API_URL: ${{ vars.MEOI_API_URL }}
