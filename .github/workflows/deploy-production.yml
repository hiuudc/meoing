name: Deploy production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA on main with a successful push CI run
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
      - name: Validate release commit
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be an exact 40-character Git commit SHA" >&2
            exit 1
          fi

          resolved_sha="$(git rev-parse --verify "${RELEASE_SHA}^{commit}")"
          if [[ "${resolved_sha,,}" != "${RELEASE_SHA,,}" ]]; then
            echo "commit_sha did not resolve to the exact requested commit" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$resolved_sha" origin/main; then
            echo "The requested release commit is not reachable from origin/main" >&2
            exit 1
          fi

          successful_ci_runs="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${resolved_sha}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(
                .conclusion == "success"
                and .event == "push"
                and .head_branch == "main"
              )] | length'
          )"
          if [[ "$successful_ci_runs" -lt 1 ]]; then
            echo "No successful main push CI run exists for ${resolved_sha}" >&2
            exit 1
          fi

          git checkout --detach "$resolved_sha"
          echo "release_sha=$resolved_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Verify production database target before migrations
        run: npm run db:target:verify
        working-directory: backend
        env:
          MEOING_DATABASE_ENVIRONMENT: production
          MEOING_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.EXPECTED_SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Verify API secret bindings
        shell: bash
        run: |
          set -euo pipefail
          configured_secrets="$(
            npx wrangler secret list \
              --config wrangler.api.jsonc \
              --env production \
              --format json
          )"
          for required_secret in \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            INVITE_TOKEN_SECRET \
            TURNSTILE_SECRET_KEY \
            OPENAI_API_KEY
          do
            jq -e \
              --arg required_secret "$required_secret" \
              'any(.[]; .name == $required_secret and .type == "secret_text")' \
              <<<"$configured_secrets" >/dev/null ||
              {
                echo "The production API Worker is missing ${required_secret}." >&2
                exit 1
              }
          done
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify maintenance secret binding
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list \
            --config wrangler.maintenance.jsonc \
            --env production \
            --format json |
            jq -e 'any(.[]; .name == "SUPABASE_SECRET_KEY" and .type == "secret_text")' \
              >/dev/null ||
            {
              echo "The production maintenance Worker is missing SUPABASE_SECRET_KEY." >&2
              exit 1
            }
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm ci
        working-directory: frontend
      - name: Write production release marker
        shell: bash
        run: |
          set -euo pipefail
          jq --null-input \
            --arg environment "production" \
            --arg commit_sha "$RELEASE_SHA" \
            '{environment: $environment, commitSha: $commit_sha}' \
            > public/release.json
        working-directory: frontend
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
      - name: Verify release
        run: npm run check
        working-directory: backend
      - name: Verify frontend
        run: npm run test
        working-directory: frontend
      - name: Build website
        run: npm run build
        working-directory: frontend
        env:
          VITE_MEOI_API_URL: ${{ vars.MEOI_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Start disposable Supabase database
        run: npm run db:start
        working-directory: backend
      - name: Apply migrations and seed locally
        run: npx supabase db reset
        working-directory: backend
      - name: Run production-release pgTAP/RLS tests
        run: npx supabase test db
        working-directory: backend
      - name: Stop disposable Supabase database
        if: always()
        run: npx supabase stop --no-backup
        working-directory: backend
      - name: Link production database
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Verify production Cost Guard preflight
        run: bash ../.github/scripts/verify-production-cost-guard.sh
        working-directory: backend
        env:
          COST_GUARD_ENVIRONMENT: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_COST_GUARD_ACCESS_KEY_ID: ${{ secrets.R2_COST_GUARD_STATE_READ_ACCESS_KEY_ID }}
          R2_COST_GUARD_SECRET_ACCESS_KEY: ${{ secrets.R2_COST_GUARD_STATE_READ_SECRET_ACCESS_KEY }}
      - name: Apply and verify production R2 CORS
        shell: bash
        run: |
          set -euo pipefail
          bucket_name="meoing-files-production"
          npx wrangler r2 bucket cors set "$bucket_name" \
            --file config/r2-cors.production.json \
            --force
          live_cors="$(
            curl --silent --show-error --fail \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${bucket_name}/cors"
          )"
          jq -e \
            --slurpfile expected config/r2-cors.production.json \
            '.success == true and .result == $expected[0]' \
            <<<"$live_cors" >/dev/null
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_CORS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply production migrations
        run: npx supabase db push --linked --include-all
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Configure and verify production database identity
        run: npm run db:identity:configure
        working-directory: backend
        env:
          MEOING_DATABASE_ENVIRONMENT: production
          MEOING_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.EXPECTED_SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Verify API deploy cannot manage public routes
        run: npm run cost-guard:deploy-boundary
        working-directory: backend
      - name: Deploy API Worker
        run: npx wrangler deploy --config wrangler.api.jsonc --env production
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy maintenance Worker
        run: npx wrangler deploy --config wrangler.maintenance.jsonc --env production
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy production Pages
        run: npx wrangler pages deploy ../frontend/dist-pages --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail

          expected_web_origin="https://meoing.com"
          for page_path in "/" "/auth/callback" "/privacy" "/terms"; do
            curl --silent --show-error --fail --location \
              --retry 5 --retry-all-errors --retry-delay 5 \
              "${expected_web_origin}${page_path}" \
              --output /dev/null
          done

          release_payload="$(
            curl --silent --show-error --fail --location \
              --header "Cache-Control: no-cache" \
              --retry 5 --retry-all-errors --retry-delay 5 \
              "${expected_web_origin}/release.json?release=${RELEASE_SHA}"
          )"
          jq -e \
            --arg environment "production" \
            --arg commit_sha "$RELEASE_SHA" \
            '.environment == $environment and .commitSha == $commit_sha' \
            <<<"$release_payload" >/dev/null

          live_payload="$(
            curl --silent --show-error --fail --retry 5 --retry-delay 5 \
              "${MEOI_API_URL}/health/live"
          )"
          ready_payload="$(
            curl --silent --show-error --fail --retry 5 --retry-delay 5 \
              "${MEOI_API_URL}/health/ready"
          )"
          jq -e \
            --arg environment "production" \
            --arg project_ref "$EXPECTED_SUPABASE_PROJECT_REF" \
            '.data.status == "ok"
             and .data.environment == $environment
             and .data.supabaseProjectRef == $project_ref' \
            <<<"$live_payload" >/dev/null
          jq -e \
            --arg environment "production" \
            --arg project_ref "$EXPECTED_SUPABASE_PROJECT_REF" \
            '.data.status == "ready"
             and .data.databaseEnvironment == $environment
             and .data.databaseProjectRef == $project_ref' \
            <<<"$ready_payload" >/dev/null
        env:
          MEOI_API_URL: ${{ vars.MEOI_API_URL }}
          EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.EXPECTED_SUPABASE_PROJECT_REF }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
      - name: Verify production Cost Guard postflight
        run: bash ../.github/scripts/verify-production-cost-guard.sh
        working-directory: backend
        env:
          COST_GUARD_ENVIRONMENT: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_COST_GUARD_ACCESS_KEY_ID: ${{ secrets.R2_COST_GUARD_STATE_READ_ACCESS_KEY_ID }}
          R2_COST_GUARD_SECRET_ACCESS_KEY: ${{ secrets.R2_COST_GUARD_STATE_READ_SECRET_ACCESS_KEY }}
