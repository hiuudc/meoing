name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run check
        working-directory: backend
      - name: Validate credentialed acceptance harness
        run: npm run acceptance:check
        working-directory: backend
      - name: Verify generated OpenAPI contract
        run: |
          npm run openapi:types
          git diff --exit-code -- openapi.json ../frontend/src/api/generated.ts
        working-directory: backend

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate operations shell scripts
        run: bash -n .github/scripts/backup-production.sh .github/scripts/restore-drill.sh

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Start local Supabase
        run: npm run db:start
        working-directory: backend
      - name: Apply migrations and seed
        run: npx supabase db reset
        working-directory: backend
      - name: Run pgTAP/RLS tests
        run: npx supabase test db
        working-directory: backend
      - name: Run invite redemption concurrency test
        run: npm run db:concurrency
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
        working-directory: backend
