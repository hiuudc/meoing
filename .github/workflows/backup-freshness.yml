name: Production backup freshness monitor

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup-freshness
  cancel-in-progress: false

jobs:
  freshness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-backup
    steps:
      - name: Require the protected main ref
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a fresh verified weekly backup
        run: bash .github/scripts/check-backup-freshness.sh
        env:
          RESTORE_MAX_AGE_SECONDS: "691200"
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_READ_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BACKUP_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
