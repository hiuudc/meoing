name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Verify staging database target before migrations
        run: npm run db:target:verify
        working-directory: backend
        env:
          MEOING_DATABASE_ENVIRONMENT: staging
          MEOING_EXPECTED_SUPABASE_PROJECT_REF: sdwuwmyrbdaarxokxmsf
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Verify maintenance secret binding
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list \
            --config wrangler.maintenance.jsonc \
            --env staging \
            --format json |
            jq -e 'any(.[]; .name == "SUPABASE_SECRET_KEY" and .type == "secret_text")' \
              >/dev/null ||
            {
              echo "The staging maintenance Worker is missing SUPABASE_SECRET_KEY." >&2
              exit 1
            }
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Link staging database
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
        working-directory: backend
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Apply staging migrations
        run: npx supabase db push --linked --include-all
        working-directory: backend
      - name: Configure and verify staging database identity
        run: npm run db:identity:configure
        working-directory: backend
        env:
          MEOING_DATABASE_ENVIRONMENT: staging
          MEOING_EXPECTED_SUPABASE_PROJECT_REF: sdwuwmyrbdaarxokxmsf
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Deploy API Worker
        run: npx wrangler deploy --config wrangler.api.jsonc --env staging
        working-directory: backend
      - name: Deploy maintenance Worker
        run: npx wrangler deploy --config wrangler.maintenance.jsonc --env staging
        working-directory: backend
      - name: Build web application and staging extension
        run: npm run build
        working-directory: frontend
        env:
          VITE_MEOI_API_URL: ${{ vars.MEOI_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          MEOI_WEB_ORIGINS: ${{ vars.MEOI_WEB_ORIGINS }}
          MEOI_REQUIRE_WEB_ORIGINS: "true"
      - name: Upload staging extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: meoi-bridge-v8-staging-${{ github.event.workflow_run.head_sha }}
          path: frontend/dist-extension
          if-no-files-found: error
          retention-days: 14
      - name: Deploy staging Pages
        run: npx wrangler pages deploy ../frontend/dist-pages --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch staging
        working-directory: backend
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          live_payload="$(
            curl --silent --show-error --fail --retry 5 --retry-delay 5 \
              "${MEOI_API_URL}/health/live"
          )"
          ready_payload="$(
            curl --silent --show-error --fail --retry 5 --retry-delay 5 \
              "${MEOI_API_URL}/health/ready"
          )"
          jq -e \
            --arg environment "staging" \
            --arg project_ref "$EXPECTED_SUPABASE_PROJECT_REF" \
            '.data.status == "ok"
             and .data.environment == $environment
             and .data.supabaseProjectRef == $project_ref' \
            <<<"$live_payload" >/dev/null
          jq -e \
            --arg environment "staging" \
            --arg project_ref "$EXPECTED_SUPABASE_PROJECT_REF" \
            '.data.status == "ready"
             and .data.databaseEnvironment == $environment
             and .data.databaseProjectRef == $project_ref' \
            <<<"$ready_payload" >/dev/null
        env:
          MEOI_API_URL: ${{ vars.MEOI_API_URL }}
          EXPECTED_SUPABASE_PROJECT_REF: sdwuwmyrbdaarxokxmsf
