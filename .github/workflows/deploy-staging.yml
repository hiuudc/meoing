name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Generate ephemeral local Supabase signing key
        run: npm run auth:key:local
        working-directory: backend
      - name: Verify staging database target before migrations
        run: npm run db:target:verify
        working-directory: backend
        env:
          MEOING_DATABASE_ENVIRONMENT: staging
          MEOING_EXPECTED_SUPABASE_PROJECT_REF: sdwuwmyrbdaarxokxmsf
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Verify API secret bindings
        shell: bash
        run: |
          set -euo pipefail
          configured_secrets="$(
            npx wrangler secret list \
              --config wrangler.api.jsonc \
              --env staging \
              --format json
          )"
          for required_secret in \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            INVITE_TOKEN_SECRET \
            TURNSTILE_SECRET_KEY
          do
            jq -e \
              --arg required_secret "$required_secret" \
              'any(.[]; .name == $required_secret and .type == "secret_text")' \
              <<<"$configured_secrets" >/dev/null ||
              {
                echo "The staging API Worker is missing ${required_secret}." >&2
                exit 1
              }
          done
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify maintenance secret binding
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list \
            --config wrangler.maintenance.jsonc \
            --env staging \
            --format json |
            jq -e 'any(.[]; .name == "SUPABASE_SECRET_KEY" and .type == "secret_text")' \
              >/dev/null ||
            {
              echo "The staging maintenance Worker is missing SUPABASE_SECRET_KEY." >&2
              exit 1
            }
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm ci
        working-directory: frontend
      - name: Link staging database
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Apply staging migrations
        run: npx supabase db push --linked --include-all
        working-directory: backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Configure and verify staging database identity
        run: npm run db:identity:configure
        working-directory: backend
        env:
          MEOING_DATABASE_ENVIRONMENT: staging
          MEOING_EXPECTED_SUPABASE_PROJECT_REF: sdwuwmyrbdaarxokxmsf
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Verify API deploy cannot manage public routes
        run: npm run cost-guard:deploy-boundary
        working-directory: backend
      - name: Deploy API Worker
        run: npx wrangler deploy --config wrangler.api.jsonc --env staging
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy maintenance Worker
        run: npx wrangler deploy --config wrangler.maintenance.jsonc --env staging
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build web application and staging extension
        run: npm run build
        working-directory: frontend
        env:
          VITE_MEOI_API_URL: ${{ vars.MEOI_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          MEOI_WEB_ORIGINS: ${{ vars.MEOI_WEB_ORIGINS }}
          MEOI_REQUIRE_WEB_ORIGINS: "true"
      - name: Upload staging extension artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meoi-bridge-v8-staging-${{ github.event.workflow_run.head_sha }}
          path: frontend/dist-extension
          if-no-files-found: error
          retention-days: 14
      - name: Deploy staging Pages
        run: npx wrangler pages deploy ../frontend/dist-pages --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch staging
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          live_payload="$(
            curl --silent --show-error --fail --retry 5 --retry-delay 5 \
              "${MEOI_API_URL}/health/live"
          )"
          ready_payload="$(
            curl --silent --show-error --fail --retry 5 --retry-delay 5 \
              "${MEOI_API_URL}/health/ready"
          )"
          jq -e \
            --arg environment "staging" \
            --arg project_ref "$EXPECTED_SUPABASE_PROJECT_REF" \
            '.data.status == "ok"
             and .data.environment == $environment
             and .data.supabaseProjectRef == $project_ref' \
            <<<"$live_payload" >/dev/null
          jq -e \
            --arg environment "staging" \
            --arg project_ref "$EXPECTED_SUPABASE_PROJECT_REF" \
            '.data.status == "ready"
             and .data.databaseEnvironment == $environment
             and .data.databaseProjectRef == $project_ref' \
            <<<"$ready_payload" >/dev/null
        env:
          MEOI_API_URL: ${{ vars.MEOI_API_URL }}
          EXPECTED_SUPABASE_PROJECT_REF: sdwuwmyrbdaarxokxmsf
