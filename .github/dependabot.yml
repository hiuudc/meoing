version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    # Security updates remain enabled; routine version-update PRs stay off.
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /backend
    # Security updates remain enabled; routine version-update PRs stay off.
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    # Security updates remain enabled; routine version-update PRs stay off.
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
